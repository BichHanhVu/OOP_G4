<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
    <div class="card p-3 shadow-sm mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchInput" placeholder="Nhập mã hoặc tên sách..." oninput="fetchAndRenderBooks()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="genreFilter" onchange="fetchAndRenderBooks()">
                    <option value="">Tất cả thể loại</option>
                    <option value="Công nghệ">Công nghệ</option>
                    <option value="Văn học">Văn học</option>
                    <option value="Kinh tế">Kinh tế</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="statusFilter" onchange="fetchAndRenderBooks()">
                    <option value="">Tất cả trạng thái</option>
                    <option value="available">Còn sách</option>
                    <option value="out_of_stock">Hết sách</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã sách</th>
                    <th>Tên sách</th>
                    <th>Tác giả</th>
                    <th>Thể loại</th>
                    <th>Số lượng hiện có</th>
                    <th>Giá trị (VNĐ)</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody id="bookTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="../js/books.js"></script>
</body>
</html>
