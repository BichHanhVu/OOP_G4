<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý bạn đọc</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <h1>Quản lý bạn đọc</h1>

    <div class="toolbar">
      <input id="searchInput" placeholder="Tìm theo mã hoặc tên..." />
      <select id="filterType" onchange="searchReaders()">
        <option value="">Tất cả loại</option>
        <option value="STUDENT">Sinh viên thường</option>
        <option value="PRIORITY_STUDENT">Sinh viên ưu tiên</option>
        <option value="LECTURER">Giảng viên</option>
      </select>
      <button onclick="searchReaders()">Tìm</button>
      <button onclick="openCreateForm()">+ Thêm bạn đọc</button>
    </div>

    <div id="message"></div>

    <table id="readerTable">
      <thead>
        <tr>
          <th>Mã</th>
          <th>Họ tên</th>
          <th>SĐT</th>
          <th>Loại</th>
          <th>Giới hạn mượn</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="readerTableBody"></tbody>
    </table>

    <div id="readerForm" style="display: none">
      <h2 id="formTitle">Thêm bạn đọc</h2>
      <input type="hidden" id="editingId" />
      <input id="nameInput" placeholder="Họ tên" />
      <input id="phoneInput" placeholder="Số điện thoại" />
      <select id="typeInput">
        <option value="STUDENT">Sinh viên thường (giới hạn 3)</option>
        <option value="PRIORITY_STUDENT">Sinh viên ưu tiên (giới hạn 5)</option>
        <option value="LECTURER">Giảng viên (giới hạn 7)</option>
      </select>
      <button onclick="submitForm()">Lưu</button>
      <button onclick="closeForm()">Hủy</button>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/readers.js"></script>
  </body>
</html>
