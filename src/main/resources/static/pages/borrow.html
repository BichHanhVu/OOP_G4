
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo phiếu mượn | Thư viện G4</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="app-sidebar" id="appSidebar">

        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">
                <i class="bi bi-book-half"></i>
            </div>
            <h1>THƯ VIỆN G4</h1>
        </div>

        <nav class="sidebar-menu">

            <a class="sidebar-link" href="../index.html">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Tổng quan</span>
            </a>

            <a class="sidebar-link" href="readers.html">
                <i class="bi bi-people-fill"></i>
                <span>Bạn đọc</span>
            </a>

            <a class="sidebar-link" href="books.html">
                <i class="bi bi-book-fill"></i>
                <span>Sách</span>
            </a>

            <a class="sidebar-link active" href="borrow.html">
                <i class="bi bi-journal-plus"></i>
                <span>Mượn sách</span>
            </a>

            <a class="sidebar-link" href="tickets.html">
                <i class="bi bi-receipt"></i>
                <span>Phiếu mượn</span>
            </a>

            <a class="sidebar-link" href="return.html">
                <i class="bi bi-arrow-return-left"></i>
                <span>Trả sách</span>
            </a>

            <a class="sidebar-link" href="history.html">
                <i class="bi bi-clock-history"></i>
                <span>Lịch sử</span>
            </a>

        </nav>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="app-main">

        <!-- HEADER -->
        <header class="app-header">

            <div style="display:flex;align-items:center;gap:14px">

                <button class="menu-toggle"
                        id="menuToggle"
                        type="button">
                    <i class="bi bi-list"></i>
                </button>

                <div class="header-title">
                    <h1>Tạo phiếu mượn</h1>
                    <p>Lập phiếu mượn cho một hoặc nhiều sách</p>
                </div>

            </div>

        </header>


        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- MESSAGE -->
            <div id="message"></div>


            <!-- THÔNG TIN PHIẾU -->
            <section class="content-card">

                <div class="card-header">

                    <div>
                        <h2 class="card-title">
                            Thông tin phiếu mượn
                        </h2>

                        <p class="card-description">
                            Nhập bạn đọc và thời gian mượn
                        </p>
                    </div>

                </div>


                <!-- MÃ BẠN ĐỌC -->
                <div class="form-group">

                    <label class="form-label">
                        Mã bạn đọc
                    </label>

                    <input
                            type="text"
                            id="readerId"
                            placeholder="Ví dụ: R001"
                    >

                </div>


                <!-- NGÀY MƯỢN + HẠN TRẢ -->
                <div style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:16px;
        ">

                    <div class="form-group">

                        <label class="form-label">
                            Ngày mượn
                        </label>

                        <input
                                type="date"
                                id="borrowDate"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Hạn trả
                        </label>

                        <input
                                type="date"
                                id="dueDate"
                        >

                    </div>

                </div>

            </section>


            <!-- DANH SÁCH SÁCH -->
            <section
                    class="content-card"
                    style="margin-top:20px"
            >

                <div class="card-header">

                    <div>

                        <h2 class="card-title">
                            Danh sách sách mượn
                        </h2>

                        <p class="card-description">
                            Thêm từng sách và số lượng
                        </p>

                    </div>

                </div>


                <!-- TOOLBAR -->
                <div class="toolbar">

                    <input
                            type="text"
                            id="bookId"
                            placeholder="Mã sách"
                    >

                    <input
                            type="number"
                            id="quantity"
                            min="1"
                            value="1"
                    >

                    <button
                            class="btn btn-secondary"
                            type="button"
                            onclick="addItem()"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Thêm sách
                    </button>

                </div>


                <!-- TABLE -->
                <div class="table-wrapper">

                    <table>

                        <thead>

                        <tr>
                            <th>Mã sách</th>
                            <th>Số lượng</th>
                            <th>Thao tác</th>
                        </tr>

                        </thead>

                        <tbody id="itemsTableBody">
                        </tbody>

                    </table>

                </div>


                <!-- CREATE TICKET -->
                <div style="
          margin-top:18px;
          text-align:right;
        ">

                    <button
                            class="btn btn-primary"
                            type="button"
                            onclick="createTicket()"
                    >

                        <i class="bi bi-check2-circle"></i>
                        Tạo phiếu mượn

                    </button>

                </div>

            </section>

        </div>

    </main>

</div>


<!-- JAVASCRIPT -->
<script src="../js/borrow.js"></script>

<script>

    const menuToggle =
        document.getElementById("menuToggle");

    const appSidebar =
        document.getElementById("appSidebar");

    menuToggle.addEventListener("click", () => {

        appSidebar.classList.toggle("open");

    });

</script>

</body>
</html>
