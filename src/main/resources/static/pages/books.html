<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Sách</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-primary mb-0">Quản Lý Sách</h3>
        <div class="d-flex gap-2">
          <a href="/api/books/export" class="btn btn-outline-success">
            Xuất file
          </a>
          <label class="btn btn-outline-primary mb-0">
            Nhập file
            <input
              type="file"
              id="importFileInput"
              accept=".csv"
              onchange="importBooks(event)"
              hidden
            />
          </label>
          <button class="btn btn-primary" onclick="openAddModal()">
            + Thêm sách mới
          </button>
        </div>
      </div>

      <div class="card p-3 shadow-sm mb-4">
        <div class="row g-3">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              id="searchInput"
              placeholder="Nhập mã hoặc tên sách..."
              oninput="fetchAndRenderBooks()"
            />
          </div>
          <div class="col-md-3">
            <select
              class="form-select"
              id="genreFilter"
              onchange="fetchAndRenderBooks()"
            >
              <option value="">Tất cả thể loại</option>
            </select>
          </div>
          <div class="col-md-3">
            <select
              class="form-select"
              id="statusFilter"
              onchange="fetchAndRenderBooks()"
            >
              <option value="">Tất cả trạng thái</option>
              <option value="available">Còn sách</option>
              <option value="out_of_stock">Hết sách</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Mã sách</th>
                <th>Tên sách</th>
                <th>Tác giả</th>
                <th>Thể loại</th>
                <th>Số lượng</th>
                <th>Giá trị (VNĐ)</th>
                <th>Trạng thái</th>
                <th class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody id="bookTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="bookModalLabel">Thêm sách mới</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="bookForm" onsubmit="saveBook(event)">
            <div class="modal-body">
              <input type="hidden" id="isEditMode" value="false" />

              <div class="mb-3">
                <label for="bookId" class="form-label">Mã sách</label>
                <input type="text" class="form-control" id="bookId" required />
              </div>
              <div class="mb-3">
                <label for="bookTitle" class="form-label">Tên sách</label>
                <input
                  type="text"
                  class="form-control"
                  id="bookTitle"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="bookAuthor" class="form-label">Tác giả</label>
                <input
                  type="text"
                  class="form-control"
                  id="bookAuthor"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="bookGenre" class="form-label">Thể loại</label>
                <input
                  type="text"
                  class="form-control"
                  id="bookGenre"
                  list="genreOptions"
                  placeholder="Chọn hoặc nhập thể loại mới..."
                  required
                />
                <datalist id="genreOptions"></datalist>
              </div>
              <div class="mb-3">
                <label for="bookQuantity" class="form-label"
                  >Số lượng hiện có</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="bookQuantity"
                  min="0"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="bookPrice" class="form-label">Giá trị (VNĐ)</label>
                <input
                  type="number"
                  class="form-control"
                  id="bookPrice"
                  min="0"
                  step="1000"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Hủy
              </button>
              <button type="submit" class="btn btn-primary">
                Lưu thông tin
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/books.js"></script>
  </body>
</html>
