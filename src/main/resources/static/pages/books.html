<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
    <!-- Nút Thêm Sách Mới -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-primary mb-0">Quản Lý Thư Viện Sách</h3>
        <button class="btn btn-primary" onclick="openAddModal()">
            + Thêm sách mới
        </button>
    </div>

    <!-- Thanh lọc & tìm kiếm -->
    <div class="card p-3 shadow-sm mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchInput" placeholder="Nhập mã hoặc tên sách..." oninput="fetchAndRenderBooks()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="genreFilter" onchange="fetchAndRenderBooks()">
                    <option value="">Tất cả thể loại</option>
                    <option value="Công nghệ">Công nghệ</option>
                    <option value="Văn học">Văn học</option>
                    <option value="Kinh tế">Kinh tế</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="statusFilter" onchange="fetchAndRenderBooks()">
                    <option value="">Tất cả trạng thái</option>
                    <option value="available">Còn sách</option>
                    <option value="out_of_stock">Hết sách</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Bảng hiển thị danh sách sách -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã sách</th>
                    <th>Tên sách</th>
                    <th>Tác giả</th>
                    <th>Thể loại</th>
                    <th>Số lượng</th>
                    <th>Giá trị (VNĐ)</th>
                    <th>Trạng thái</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody id="bookTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Dùng Chung cho Thêm Mới & Cập Nhật -->
<div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="bookModalLabel">Thêm sách mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="bookForm" onsubmit="saveBook(event)">
                <div class="modal-body">
                    <input type="hidden" id="isEditMode" value="false">

                    <div class="mb-3">
                        <label for="bookCode" class="form-label">Mã sách</label>
                        <input type="text" class="form-control" id="bookCode" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookTitle" class="form-label">Tên sách</label>
                        <input type="text" class="form-control" id="bookTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookAuthor" class="form-label">Tác giả</label>
                        <input type="text" class="form-control" id="bookAuthor" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookGenre" class="form-label">Thể loại</label>
                        <select class="form-select" id="bookGenre" required>
                            <option value="Công nghệ">Công nghệ</option>
                            <option value="Văn học">Văn học</option>
                            <option value="Kinh tế">Kinh tế</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="bookQuantity" class="form-label">Số lượng hiện có</label>
                        <input type="number" class="form-control" id="bookQuantity" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="bookPrice" class="form-label">Giá trị (VNĐ)</label>
                        <input type="number" class="form-control" id="bookPrice" min="0" step="1000" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/books.js"></script>
</body>
</html>
