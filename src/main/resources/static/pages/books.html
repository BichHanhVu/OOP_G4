<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sách | Thư viện G4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon"><i class="bi bi-book-half"></i></div>
                <h1>THƯ VIỆN G4</h1>
            </div>
            <nav class="sidebar-menu"><a class="sidebar-link" href="../index.html"><i
                        class="bi bi-grid-1x2-fill"></i><span>Tổng quan</span></a>
                <a class="sidebar-link" href="readers.html"><i class="bi bi-people-fill"></i><span>Bạn đọc</span></a>
                <a class="sidebar-link active" href="books.html"><i class="bi bi-book-fill"></i><span>Sách</span></a>
                <a class="sidebar-link" href="borrow.html"><i class="bi bi-journal-plus"></i><span>Mượn sách</span></a>
                <a class="sidebar-link" href="tickets.html"><i class="bi bi-receipt"></i><span>Phiếu mượn</span></a>
                <a class="sidebar-link" href="return.html"><i class="bi bi-arrow-return-left"></i><span>Trả
                        sách</span></a>
                <a class="sidebar-link" href="history.html"><i class="bi bi-clock-history"></i><span>Lịch sử</span></a>
            </nav>
        </aside>
        <main class="app-main">
            <header class="app-header">
                <div style="display:flex;align-items:center;gap:14px">
                    <button class="menu-toggle" id="menuToggle" type="button"><i class="bi bi-list"></i></button>
                    <div class="header-title">
                        <h1>Quản lý sách</h1>
                        <p>Theo dõi danh mục và số lượng sách trong kho</p>
                    </div>
                </div>
            </header>
            <div class="page-content">
                <div id="message"></div>
                <section class="content-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Danh sách sách</h2>
                            <p class="card-description">Tra cứu tồn kho và cập nhật sách</p>
                        </div><button class="btn btn-primary" onclick="openAddModal()"><i
                                class="bi bi-bookmark-plus"></i> Thêm sách</button>
                    </div>
                    <div class="toolbar"><input id="searchInput" placeholder="Nhập mã hoặc tên sách..."
                            oninput="fetchAndRenderBooks()"><select id="genreFilter" onchange="fetchAndRenderBooks()">
                            <option value="">Tất cả thể loại</option>
                        </select><select id="statusFilter" onchange="fetchAndRenderBooks()">
                            <option value="">Tất cả trạng thái</option>
                            <option value="available">Còn sách</option>
                            <option value="out_of_stock">Hết sách</option>
                        </select></div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Mã</th>
                                    <th>Tên sách</th>
                                    <th>Tác giả</th>
                                    <th>Thể loại</th>
                                    <th>Số lượng</th>
                                    <th>Giá trị</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="bookTableBody"></tbody>
                        </table>
                    </div>
                </section>
                <div class="modal fade" id="bookModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 class="card-title" id="bookModalLabel">Thêm sách</h2><button type="button"
                                    class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <form id="bookForm" onsubmit="saveBook(event)">
                                <div class="modal-body"><input type="hidden" id="isEditMode" value="false">
                                    <div class="form-group"><label class="form-label">Mã sách</label><input id="bookId"
                                            required></div>
                                    <div class="form-group"><label class="form-label">Tên sách</label><input
                                            id="bookTitle" required></div>
                                    <div class="form-group"><label class="form-label">Tác giả</label><input
                                            id="bookAuthor" required></div>
                                    <div class="form-group"><label class="form-label">Thể loại</label><input
                                            id="bookGenre" list="genreOptions" required><datalist
                                            id="genreOptions"></datalist></div>
                                    <div class="form-group"><label class="form-label">Số lượng</label><input
                                            type="number" id="bookQuantity" min="0" required></div>
                                    <div class="form-group"><label class="form-label">Giá trị (VNĐ)</label><input
                                            type="number" id="bookPrice" min="0" required></div>
                                </div>
                                <div class="modal-footer"><button type="button" class="btn btn-outline"
                                        data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary"
                                        type="submit">Lưu</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/books.js"></script>
    <script>
        const menuToggle = document.getElementById("menuToggle");
        const appSidebar = document.getElementById("appSidebar");
        menuToggle.addEventListener("click", () => appSidebar.classList.toggle("open"));
    </script>
</body>

</html>
